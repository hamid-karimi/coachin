<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e0e11" />
    <title>Offline · CoachIn</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0e0e11;
        color: #f5f4f0;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem;
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.5rem; color: #a7a5a0; max-width: 32ch; }
      button {
        font: inherit;
        font-weight: 600;
        color: #0b0b0d;
        background: #d4f531;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.4rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#17161a" />
        <path d="M300 40 L150 300 L250 300 L212 472 L372 240 L268 240 Z" fill="#d4f531" />
      </svg>
      <h1>You're offline</h1>
      <p>CoachIn needs a connection to load this screen. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
